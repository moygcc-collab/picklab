name: picks_automaticos

on:
  schedule:
    # Cada 3 dias a las 9:00 am de Monterrey (15:00 UTC)
    # Con el plan gratis de The Odds API (500 creditos) no alcanza para diario
    - cron: "0 15 */3 * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar_librerias
        run: pip install requests

      - name: correr_picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python correr_todo.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: publicar
        uses: actions/deploy-pages@v4
